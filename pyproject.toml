[project]
name = "ask-the-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "godric.bouteloup", email = "godric.bouteloup@epita.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ask-the-docs = "ask_the_docs.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.2.8",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
